<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1 class="game-title">Tic&nbsp;Tac&nbsp;Toe</h1>

    <div id="status" class="status" aria-live="polite">Player X's turn</div>

    <div id="board" class="board" role="grid" aria-label="Tic Tac Toe board"></div>

    <button id="reset" class="reset" type="button">New Game</button>
  </main>

  <script src="game.js"></script>
</body>
</html>
