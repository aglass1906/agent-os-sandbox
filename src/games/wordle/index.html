<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1 class="game-title">WORDLE</h1>

    <a class="back-link" href="../index.html">Back to Game Selection</a>

    <div id="status" class="status" aria-live="polite">Type a 5-letter word to begin</div>

    <div id="board" class="board" role="grid" aria-label="Wordle board"></div>

    <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>

    <div class="controls">
      <button id="reset" class="reset" type="button">New Game</button>
      <a class="reset rules-link" href="rules.html">How to Play</a>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
