<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #000;
    }

    .games-tagline {
      color: #b0bec5;
    }
  </style>
</head>
<body>
  <main class="games">
    <header class="games-header">
      <h1 class="games-title">Timbuk2 Games Hub created by Sankofa Agent OS</h1>
      <p class="games-tagline">Pick a game to play.</p>
    </header>

    <nav class="game-list" aria-label="Games">
      <a class="game-card" href="./tic-tac-toe/index.html">
        <h2 class="game-name">Tic&nbsp;Tac&nbsp;Toe</h2>
        <span class="game-desc">Classic 3&times;3 marker game</span>
      </a>

      <a class="game-card" href="./wordle/index.html">
        <h2 class="game-name">Wordle</h2>
        <span class="game-desc">Guess the hidden 5-letter word</span>
      </a>

      <a class="game-card" href="./sudoku/index.html">
        <h2 class="game-name">Sudoku</h2>
        <span class="game-desc">Fill the 9&times;9 grid with digits 1-9</span>
      </a>
    </nav>
  </main>
</body>
</html>
